name: Migraciones de base de datos

# Aplica en Supabase las migraciones nuevas de supabase/migrations cuando se aprueban en main.
# Requiere el secreto SUPABASE_DB_URL (Supabase → Connect → Session pooler → URI con la contraseña).
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency: migraciones

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Aplicar migraciones pendientes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/aplicar-migraciones.sh
